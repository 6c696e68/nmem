[package]
name = "nmem"
version = "0.1.1"
edition = "2021"
description = "Spreading-activation memory engine. Graph brain, hashed embed, MCP, local dashboard. No GPU."
license = "MIT"
authors = ["nmem-rs"]
rust-version = "1.75"

[lib]
name = "nmem"
path = "src/lib.rs"

[[bin]]
name = "nmem"
path = "src/bin/nmem.rs"

[[bin]]
name = "nmem-mcp"
path = "src/bin/nmem_mcp.rs"

[dependencies]
serde = { version = "=1.0.197", features = ["derive"] }
serde_json = "=1.0.114"
uuid = { version = "=1.6.1", features = ["v4", "serde"] }
regex = "=1.10.3"
thiserror = "=1.0.58"
clap = { version = "=4.4.18", features = ["derive"] }

[dev-dependencies]
pretty_assertions = "=1.4.0"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"

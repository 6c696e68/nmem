<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>NMEM — neural memory</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #0a0a0b;
  --bg-elevated: #121214;
  --bg-subtle: #1a1a1e;
  --fg: #f0f0f2;
  --fg-muted: #9b9ba3;
  --fg-subtle: #6e6e76;
  --border: color-mix(in oklab, var(--fg) 12%, transparent);
  --border-strong: color-mix(in oklab, var(--fg) 22%, transparent);
  --accent: #c8ccd4;
  --accent-fg: #0a0a0b;
  --ok: #7d9a86;
  --warn: #b08968;
  --bad: #b56b63;
  --radius-xs: 4px; --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-xl: 24px;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-5: 24px; --space-6: 32px; --space-7: 48px;
  --font-display: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --font-body: "Source Serif 4", Georgia, serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --text-xs: 0.75rem; --text-sm: 0.875rem; --text-base: 1.02rem;
  --text-lg: 1.25rem; --text-xl: clamp(1.6rem, 1.2rem + 1.4vw, 2.1rem);
  --motion-quick: 150ms; --motion-fast: 250ms;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); line-height: 1.5; }
button, [role=button] { cursor: pointer; }
button { font: inherit; }
a { color: inherit; }
.wrap { max-width: 1120px; margin: 0 auto; padding: var(--space-5) var(--space-4) var(--space-7); }
header.top { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-4); margin-bottom: var(--space-6); flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-size: var(--text-xl); font-weight: 600; letter-spacing: -0.03em; line-height: 1.1; }
.brand span { display: block; font-family: var(--font-mono); font-size: var(--text-xs); font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-subtle); margin-bottom: var(--space-2); }
.clock { font-family: var(--font-mono); font-size: var(--text-sm); color: var(--fg-muted); text-align: right; }
.clock b { display: block; color: var(--fg); font-weight: 500; font-size: var(--text-base); font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: var(--space-3); margin-bottom: var(--space-5); }
.stat { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-4); }
.stat .k { font-family: var(--font-mono); font-size: var(--text-xs); letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-subtle); }
.stat .v { font-family: var(--font-mono); font-size: 1.45rem; font-variant-numeric: tabular-nums; margin-top: 4px; letter-spacing: -0.03em; }
.stat .v.grade-A { color: var(--ok); }
.stat .v.grade-B { color: var(--ok); }
.stat .v.grade-C, .stat .v.grade-D { color: var(--warn); }
.stat .v.grade-F { color: var(--bad); }
.grid { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: var(--space-4); }
@media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
.panel { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: var(--space-5); }
.panel h2 { font-size: var(--text-sm); font-family: var(--font-mono); font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-subtle); margin: 0 0 var(--space-4); }
.row { display: flex; gap: var(--space-2); }
input, textarea { width: 100%; background: var(--bg); color: var(--fg); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); padding: 12px 14px; font-family: var(--font-body); font-size: var(--text-base); min-height: 44px; }
textarea { min-height: 88px; resize: vertical; }
input:focus, textarea:focus { outline: 2px solid color-mix(in oklab, var(--accent) 45%, transparent); outline-offset: 1px; }
.btn { border: 0; border-radius: var(--radius-sm); padding: 12px 16px; min-height: 44px; font-family: var(--font-mono); font-size: var(--text-sm); font-weight: 500; letter-spacing: 0.02em; transition: transform var(--motion-quick) var(--ease), opacity var(--motion-quick) var(--ease); }
.btn:active { transform: scale(0.98); }
.btn-pri { background: var(--accent); color: var(--accent-fg); }
.btn-sec { background: transparent; color: var(--fg); border: 1px solid var(--border-strong); }
.btn:disabled { opacity: 0.45; }
.list { display: flex; flex-direction: column; gap: var(--space-3); }
.card { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--space-4); }
.card .meta { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; margin-bottom: var(--space-2); font-family: var(--font-mono); font-size: var(--text-xs); color: var(--fg-subtle); }
.chip { border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px; }
.card p { margin: 0; font-size: var(--text-base); }
.card .why { margin-top: var(--space-2); color: var(--fg-muted); font-size: var(--text-sm); }
.empty { color: var(--fg-subtle); font-size: var(--text-sm); padding: var(--space-4) 0; }
.issues { margin: 0; padding-left: 1.1em; color: var(--warn); font-size: var(--text-sm); }
.err { color: var(--bad); font-size: var(--text-sm); margin-top: var(--space-2); }
.okmsg { color: var(--ok); font-size: var(--text-sm); margin-top: var(--space-2); }
.hint { color: var(--fg-subtle); font-size: var(--text-xs); font-family: var(--font-mono); margin-top: var(--space-2); }
footer { margin-top: var(--space-6); color: var(--fg-subtle); font-family: var(--font-mono); font-size: var(--text-xs); }
@media (prefers-reduced-motion: reduce) {
  .btn { transition: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span>spreading activation</span>Neural memory</div>
    <div class="clock" id="clock"><b>—</b><span id="tz">local</span></div>
  </header>
  <section class="stats" id="stats"></section>
  <div class="grid">
    <div class="panel">
      <h2>Recall</h2>
      <form class="row" id="recall-form">
        <input id="q" name="q" placeholder="why did the outage happen" autocomplete="off"/>
        <button class="btn btn-pri" type="submit">Search</button>
      </form>
      <p class="hint">Graph walk + hashed embed (128-d, no GPU)</p>
      <div class="list" id="hits" style="margin-top:var(--space-4)"></div>
      <div id="causal"></div>
    </div>
    <div class="panel">
      <h2>Remember</h2>
      <form id="mem-form">
        <textarea id="content" placeholder="A fact, decision, or what just broke."></textarea>
        <div class="row" style="margin-top:var(--space-3)">
          <button class="btn btn-pri" type="submit">Store</button>
          <button class="btn btn-sec" type="button" id="btn-con">Consolidate</button>
        </div>
        <div id="mem-msg"></div>
      </form>
    </div>
  </div>
  <div class="panel" style="margin-top:var(--space-4)">
    <h2>Fibers</h2>
    <div class="list" id="fibers"></div>
  </div>
  <footer id="foot"></footer>
</div>
<script>
const $ = (id) => document.getElementById(id);
function esc(s) { const d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; }
async function api(path, opt) {
  const r = await fetch(path, opt);
  const t = await r.text();
  try { return JSON.parse(t); } catch { throw new Error(t || r.statusText); }
}
function chip(s) { return `<span class="chip">${esc(s)}</span>`; }
function renderHits(rows, host) {
  if (!rows || !rows.length) { host.innerHTML = `<div class="empty">No live fibers matched.</div>`; return; }
  host.innerHTML = rows.map(m => `
    <article class="card">
      <div class="meta">${chip(m.type)} ${chip("hop " + m.hop)} ${chip("conf " + Number(m.confidence).toFixed(2))} ${chip("emb " + Number(m.embed).toFixed(2))}</div>
      <p>${esc(m.summary)}</p>
      <div class="why">${esc(m.reason || "")}</div>
    </article>`).join("");
}
function renderFibers(rows) {
  const host = $("fibers");
  if (!rows.length) { host.innerHTML = `<div class="empty">Brain is empty. Store a memory to start the graph.</div>`; return; }
  host.innerHTML = rows.map(f => `
    <article class="card">
      <div class="meta">${chip(f.type)} ${chip(f.status)} ${chip(f.stage)} <span>${esc(f.when)}</span></div>
      <p>${esc(f.summary)}</p>
    </article>`).join("");
}
async function refresh() {
  const [meta, health, mems] = await Promise.all([
    api("/api/meta"), api("/api/health"), api("/api/memories?limit=24")
  ]);
  $("tz").textContent = `${meta.tz.label} · ${meta.tz.source} · ${meta.tz.offset_hours >= 0 ? "+" : ""}${meta.tz.offset_hours}h`;
  $("clock").querySelector("b").textContent = meta.now_local;
  $("stats").innerHTML = `
    <div class="stat"><div class="k">Health</div><div class="v grade-${esc(health.grade)}">${esc(health.grade)} ${health.score}</div></div>
    <div class="stat"><div class="k">Fibers</div><div class="v">${health.fibers}</div></div>
    <div class="stat"><div class="k">Neurons</div><div class="v">${health.neurons}</div></div>
    <div class="stat"><div class="k">Synapses</div><div class="v">${health.synapses}</div></div>`;
  renderFibers(mems.memories || []);
  $("foot").textContent = `embed dim ${meta.embed_dim} · ${meta.version} · ${health.issues.length ? health.issues.join(" · ") : "no issues"}`;
}
$("recall-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const q = $("q").value.trim();
  if (!q) return;
  const r = await api("/api/recall?q=" + encodeURIComponent(q));
  renderHits(r.memories, $("hits"));
  const c = await api("/api/causal?q=" + encodeURIComponent(q));
  const box = $("causal");
  if (c.chain && c.chain.length) {
    box.innerHTML = `<h2 style="margin-top:var(--space-5)">Causal</h2>` + c.chain.map(h =>
      `<div class="card"><div class="meta">${chip(h.synapse)} hop ${h.depth}</div><p>${esc(h.from_content)} → ${esc(h.to_content)}</p></div>`
    ).join("");
  } else { box.innerHTML = ""; }
});
$("mem-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const content = $("content").value.trim();
  const msg = $("mem-msg");
  if (!content) { msg.innerHTML = `<div class="err">Nothing to store.</div>`; return; }
  const r = await api("/api/remember", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ content }) });
  if (r.error) { msg.innerHTML = `<div class="err">${esc(r.error)}</div>`; return; }
  $("content").value = "";
  msg.innerHTML = `<div class="okmsg">Stored ${esc(r.type)} · ${r.neurons} neurons</div>`;
  await refresh();
});
$("btn-con").addEventListener("click", async () => {
  const r = await api("/api/consolidate", { method: "POST", body: "{}" });
  $("mem-msg").innerHTML = `<div class="okmsg">Consolidated · expired ${r.expired || 0} · merged ${r.fibers_merged || 0}</div>`;
  await refresh();
});
refresh().catch((e) => { $("foot").textContent = String(e); });
setInterval(() => { api("/api/meta").then(m => { $("clock").querySelector("b").textContent = m.now_local; }).catch(() => {}); }, 15000);
</script>
</body>
</html>
